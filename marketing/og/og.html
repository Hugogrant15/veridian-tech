<!doctype html>
<!--
  Link-preview card (WhatsApp, LinkedIn, Facebook, X), 1200x630.
  Render with render-og.cjs; it writes ../../public/og.png.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veridian link preview</title>
<style>
@font-face { font-family: "Inter Tight"; src: url(../../public/fonts/InterTight-variable.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Instrument Serif"; src: url(../../public/fonts/InstrumentSerif-400-italic.woff2) format("woff2"); font-style: italic; font-weight: 400; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #F5F7F2; font-family: "Inter Tight", sans-serif; color: #0F1F17; }
.card { position: relative; display: flex; height: 630px; }
.grain { position: absolute; inset: 0; background: url(../../public/grain.png); background-size: 180px; opacity: .5; }
.left { position: relative; flex: 1; padding: 64px 0 56px 72px; display: flex; flex-direction: column; }
.logo { height: 96px; align-self: flex-start; }
h1 { margin: auto 0 0; font-weight: 300; font-size: 84px; line-height: 1; letter-spacing: -.035em; }
h1 em { display: block; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 100px; letter-spacing: -.01em; color: #075C33; }
p { margin: 22px 0 0; font-size: 26px; color: #414141; max-width: 640px; line-height: 1.3; }
.site { margin-top: 26px; font-size: 22px; font-weight: 600; letter-spacing: .02em; color: #075C33; }
.right { position: relative; width: 380px; background: #062B1C; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 0 44px; }
.right::before { content: ""; position: absolute; left: 0; top: 64px; bottom: 64px; width: 2px; background: #C9A55C; }
.row { color: #F5F7F2; font-size: 27px; font-weight: 500; letter-spacing: -.01em; padding-bottom: 20px; border-bottom: 1px solid rgba(201,165,92,.25); }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row span { display: block; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 24px; color: #C9A55C; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="grain"></div>
  <div class="left">
    <img class="logo" src="../../public/veridian-signature.png" alt="">
    <h1>Your business, <em>properly online.</em></h1>
    <p>Websites, online stores and mobile apps for Nigerian businesses.</p>
    <div class="site" data-website></div>
  </div>
  <div class="right">
    <div class="row"><span>01</span>Websites</div>
    <div class="row"><span>02</span>Online stores</div>
    <div class="row"><span>03</span>Mobile apps</div>
    <div class="row"><span>04</span>Redesigns</div>
  </div>
</div>
<script src="../status-banner/brand.js"></script>
</body>
</html>
