<!DOCTYPE html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F7F2" />
    <link rel="icon" type="image/png" href="/veridian-signature.png" />
    <link rel="preload" href="/fonts/InterTight-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InstrumentSerif-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <!-- seo: fallback for `npm run dev`. The build replaces this whole block with each page's own tags (scripts/prerender.mjs). Only SEO tags go in here. -->
    <title>Veridian Tech Innovations Ltd | Websites, online stores and apps</title>
    <!-- /seo -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Veridian Tech Innovations Ltd" />
    <meta property="og:image" content="%SITE_ORIGIN%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Content fades in with JavaScript; without it, show everything. -->
    <noscript><style>.reveal, .rise { opacity: 1 !important; transform: none !important; animation: none !important; }</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
